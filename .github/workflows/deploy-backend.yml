# Copied from reeses-playoff-challenge. Terraform creates the function resources
# while CI pushes the code, so both the code push and the layer attachment
# retry through ResourceNotFoundException; and the layer job runs AFTER the
# code job so they do not collide on the same function. Nothing deploys red.

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "What to deploy"
        required: true
        type: choice
        default: all
        options: [all, specific]
      specific_lambdas:
        description: "Comma-separated lambda dir names (mode=specific)"
        required: false
        default: ""
      deploy_common_layer:
        description: "Also redeploy the shared layer"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  APP_NAME: smirnoff
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q

  detect-changes:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      common_changed: ${{ steps.changes.outputs.common }}
      changed_lambdas: ${{ steps.changes.outputs.changed_lambdas }}
      all_lambdas: ${{ steps.all-lambdas.outputs.all_lambdas }}
      has_lambda_changes: ${{ steps.changes.outputs.has_lambda_changes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - id: changes
        run: |
          MODE="${{ github.event.inputs.deploy_mode }}"
          SPECIFIC="${{ github.event.inputs.specific_lambdas }}"
          DEPLOY_LAYER="${{ github.event.inputs.deploy_common_layer }}"

          if [ "$MODE" = "all" ]; then
            ALL=$(ls -d lambdas/*/ 2>/dev/null | grep -v "lambdas/common/" | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length>0))')
            echo "common=true" >> $GITHUB_OUTPUT
            echo "changed_lambdas=$ALL" >> $GITHUB_OUTPUT
            echo "has_lambda_changes=true" >> $GITHUB_OUTPUT
          elif [ "$MODE" = "specific" ] && [ -n "$SPECIFIC" ]; then
            JSON=$(echo "$SPECIFIC" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | jq -R -s -c 'split("\n") | map(select(length>0))')
            echo "common=$DEPLOY_LAYER" >> $GITHUB_OUTPUT
            echo "changed_lambdas=$JSON" >> $GITHUB_OUTPUT
            echo "has_lambda_changes=true" >> $GITHUB_OUTPUT
          else
            # The whole push, not just the tip commit: `HEAD~1 HEAD` misses a
            # backend change buried under a frontend-only tip and reports a
            # green deploy that deployed nothing (reeses, 2026-08-06).
            # github.event.before is where the branch was before the push; fall
            # back to the tip commit when it is absent or unresolvable.
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              RANGE="$BEFORE ${{ github.sha }}"
            else
              RANGE="HEAD~1 HEAD"
            fi
            echo "Comparing $RANGE"
            CHANGED=$(git diff --name-only $RANGE 2>/dev/null || git diff --name-only HEAD)
            if echo "$CHANGED" | grep -q "^backend/lambdas/common/"; then
              echo "common=true" >> $GITHUB_OUTPUT
            else
              echo "common=false" >> $GITHUB_OUTPUT
            fi
            CHANGED_DIRS=$(echo "$CHANGED" | grep "^backend/lambdas/" | grep -v "^backend/lambdas/common/" | cut -d'/' -f3 | sort -u | grep -v '^$' || true)
            if [ -n "$CHANGED_DIRS" ]; then
              JSON=$(echo "$CHANGED_DIRS" | jq -R -s -c 'split("\n") | map(select(length>0))')
              echo "changed_lambdas=$JSON" >> $GITHUB_OUTPUT
              echo "has_lambda_changes=true" >> $GITHUB_OUTPUT
            else
              echo "changed_lambdas=[]" >> $GITHUB_OUTPUT
              echo "has_lambda_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - id: all-lambdas
        run: |
          ALL=$(ls -d lambdas/*/ 2>/dev/null | grep -v "lambdas/common/" | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "all_lambdas=$ALL" >> $GITHUB_OUTPUT

  deploy-layer:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.common_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build layer zip
        run: |
          mkdir -p python/lambdas
          cp -r lambdas/common python/lambdas/
          touch python/lambdas/__init__.py
          python -m pip install --upgrade pip
          pip install --platform manylinux2014_x86_64 --only-binary=:all: -t python/ -r requirements.txt
          # Layer must keep the python/ prefix at root so Lambda adds it to sys.path.
          zip -r ${APP_NAME}-shared-packages.zip python >/dev/null

      - id: publish
        run: |
          OUT=$(aws lambda publish-layer-version \
            --layer-name ${APP_NAME}-shared-packages \
            --zip-file fileb://${APP_NAME}-shared-packages.zip \
            --compatible-runtimes python${{ env.PYTHON_VERSION }} \
            --region $AWS_REGION --output json)
          ARN=$(echo $OUT | jq -r .LayerVersionArn)
          echo "layer_arn=$ARN" >> $GITHUB_OUTPUT
          echo "Published layer: $ARN"

  update-all-lambdas-layer:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    # Runs after deploy-changed-lambdas to avoid ResourceConflictException when
    # both jobs update the same function in parallel.
    needs: [detect-changes, deploy-layer, deploy-changed-lambdas]
    if: always() && needs.detect-changes.outputs.common_changed == 'true' && needs.deploy-layer.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.all_lambdas) }}
      fail-fast: false
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update layer config (waits for TF-created functions)
        run: |
          FN="${APP_NAME}-$(echo "${{ matrix.lambda }}" | tr '_' '-')"
          # Race with Terraform: a new function may not exist yet. Wait up to
          # 5 min for it, then attach the layer.
          for i in $(seq 1 20); do
            if aws lambda get-function --function-name $FN --region $AWS_REGION >/dev/null 2>&1; then
              break
            fi
            echo "Function $FN not yet present (attempt $i/20), sleeping 15s"
            sleep 15
          done

          if ! aws lambda get-function --function-name $FN --region $AWS_REGION >/dev/null 2>&1; then
            echo "Function $FN never appeared; skipping layer attachment"
            exit 0
          fi

          aws lambda wait function-updated --function-name $FN --region $AWS_REGION || true
          aws lambda update-function-configuration \
            --function-name $FN \
            --layers ${{ needs.deploy-layer.outputs.layer_arn }} \
            --region $AWS_REGION
          aws lambda wait function-updated --function-name $FN --region $AWS_REGION

  deploy-changed-lambdas:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    needs: [test, detect-changes, deploy-layer]
    if: always() && needs.detect-changes.outputs.has_lambda_changes == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.changed_lambdas) }}
      fail-fast: false
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Package lambda
        id: package
        run: |
          if [ ! -d "lambdas/${{ matrix.lambda }}" ]; then
            echo "Lambda dir lambdas/${{ matrix.lambda }} no longer exists; skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          cd lambdas/${{ matrix.lambda }}
          zip -r ../../${{ matrix.lambda }}.zip *

      - name: Deploy code (waits for TF-created functions)
        if: steps.package.outputs.skip != 'true'
        run: |
          FN="${APP_NAME}-$(echo "${{ matrix.lambda }}" | tr '_' '-')"
          echo "Deploying $FN"

          # Race with Terraform: retry update-function-code for up to 5 min
          # while the function resource does not exist yet.
          DEPLOYED=false
          for i in $(seq 1 20); do
            if aws lambda update-function-code --function-name $FN \
                --zip-file fileb://${{ matrix.lambda }}.zip \
                --region $AWS_REGION 2>/tmp/lambda-err; then
              DEPLOYED=true
              break
            fi
            if ! grep -q "ResourceNotFoundException" /tmp/lambda-err; then
              cat /tmp/lambda-err >&2
              exit 1
            fi
            echo "Function $FN not yet present (attempt $i/20), sleeping 15s"
            sleep 15
          done

          if [ "$DEPLOYED" != "true" ]; then
            echo "Function $FN never appeared after Terraform; skipping"
            exit 0
          fi

          aws lambda wait function-updated --function-name $FN --region $AWS_REGION

          # Use the freshly published layer when common changed; otherwise the
          # latest published version, so a new function (which Terraform
          # creates on the stub layer) gets the real one. --no-paginate keeps
          # the CLI from emitting a NextToken on a second line.
          LAYER="${{ needs.deploy-layer.outputs.layer_arn }}"
          if [ -z "$LAYER" ]; then
            LAYER=$(aws lambda list-layer-versions \
              --layer-name ${APP_NAME}-shared-packages \
              --region $AWS_REGION --no-paginate \
              --query 'LayerVersions[0].LayerVersionArn' --output text)
          fi
          if [ -n "$LAYER" ] && [ "$LAYER" != "None" ]; then
            aws lambda update-function-configuration --function-name $FN \
              --layers "$LAYER" --region $AWS_REGION
            aws lambda wait function-updated --function-name $FN --region $AWS_REGION
          fi
          echo "$FN deployed (layer=$LAYER)"

  # Reeses went green twice with stale code live: layer attachment spans two
  # jobs with three conditions between them, and one path left every function
  # on the previous layer. This asserts the invariant the whole dance exists to
  # produce -- every function runs the newest layer -- and fails if not.
  verify-layer:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    needs: [detect-changes, deploy-layer, update-all-lambdas-layer, deploy-changed-lambdas]
    if: always() && needs.detect-changes.outputs.common_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Every function must run the newest layer
        run: |
          set -euo pipefail
          LATEST=$(aws lambda list-layer-versions \
            --layer-name ${APP_NAME}-shared-packages \
            --region $AWS_REGION --no-paginate \
            --query 'LayerVersions[0].LayerVersionArn' --output text)
          echo "Newest layer: $LATEST"

          STALE=""
          for FN in $(aws lambda list-functions --region $AWS_REGION \
                        --query "Functions[?starts_with(FunctionName,'${APP_NAME}-')].FunctionName" \
                        --output text); do
            HAVE=$(aws lambda get-function-configuration --function-name "$FN" \
                     --region $AWS_REGION --query 'Layers[0].Arn' --output text)
            if [ "$HAVE" != "$LATEST" ]; then
              echo "::error::$FN is on $HAVE, not $LATEST"
              STALE="$STALE $FN"
            fi
          done

          if [ -n "$STALE" ]; then
            echo "Functions left on an old layer:$STALE" >&2
            exit 1
          fi
          echo "All functions on the newest layer."

  summary:
    needs: [detect-changes, deploy-layer, update-all-lambdas-layer, deploy-changed-lambdas, verify-layer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## Backend Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Common changed: ${{ needs.detect-changes.outputs.common_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lambdas changed: \`${{ needs.detect-changes.outputs.changed_lambdas }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Layer ARN: \`${{ needs.deploy-layer.outputs.layer_arn }}\`" >> $GITHUB_STEP_SUMMARY
