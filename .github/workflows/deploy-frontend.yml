name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  # Daily rebuild so players.json picks up names for new waiver pickups.
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  # The site bucket is named after the domain (Terraform var.domain_name).
  S3_BUCKET: smirnoff-league.com

permissions:
  contents: read

jobs:
  wait-for-terraform:
    permissions:
      actions: read # find the Terraform run on this commit
      contents: read
    uses: ./.github/workflows/wait-for-terraform.yml

  # AWS_ROLE_ARN comes from the first Terraform apply, so the first push to main
  # runs before it exists. Secrets cannot be read in a job-level `if`, hence
  # this job.
  check-role:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::notice::AWS_ROLE_ARN is not set; skipping deploy. Set it to the deploy_role_arn Terraform output."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [wait-for-terraform, check-role]
    if: needs.check-role.outputs.configured == 'true'
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Read from SSM rather than copied into GitHub secrets: xomware-infrastructure
      # owns these values, and a stale copy would keep building a bundle that
      # points at a rotated client while every sign-in fails. None are secret;
      # they all ship in the bundle or the sign-in redirect URL.
      - name: Resolve Cognito config from SSM
        run: |
          set -euo pipefail
          get() {
            aws ssm get-parameter --name "$1" \
              --query Parameter.Value --output text
          }
          {
            echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$(get /xomware/shared/cognito/user-pool-id)"
            echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$(get /xomware/shared/cognito/clients/smirnoff-id)"
            # The league's own Cognito domain (xomware-infrastructure
            # cognito_smirnoff_domain.tf), so Google's consent screen names
            # smirnoff-league.com instead of the shared amazoncognito.com host.
            echo "NEXT_PUBLIC_COGNITO_DOMAIN=auth.smirnoff-league.com"
          } >> "$GITHUB_ENV"

      # Written by this repo's Terraform (ssm.tf), so it follows the API domain.
      - name: Resolve API URL from SSM
        run: |
          set -euo pipefail
          URL=$(aws ssm get-parameter --name /smirnoff/api-url --query Parameter.Value --output text)
          echo "NEXT_PUBLIC_API_URL=$URL" >> "$GITHUB_ENV"

      - name: Build
        env:
          # postbuild's verify-build fails unless the values above reached the bundle.
          REQUIRE_AUTH_ENV: "1"
        run: npm run build

      # Found by the alias it serves rather than stored as a secret: exactly one
      # distribution fronts this hostname.
      - name: Resolve CloudFront distribution
        run: |
          set -euo pipefail
          ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items || \`[]\`, '${S3_BUCKET}')].Id | [0]" \
            --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "No CloudFront distribution serves ${S3_BUCKET}" >&2
            exit 1
          fi
          echo "DISTRIBUTION_ID=$ID" >> "$GITHUB_ENV"

      - name: Sync to S3
        # Hashed assets first with a long cache, then HTML, so no HTML lands
        # before the chunks it references.
        #
        # No --delete: a tab loaded from the previous build keeps fetching that
        # build's assets and RSC payloads on client navigation. Deleting them
        # turns every link in that tab into a silent no-op until a hard refresh.
        # Old builds are pruned below instead.
        run: |
          aws s3 sync ./out "s3://${S3_BUCKET}/" \
            --exclude "*.html" --exclude "*.txt" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./out "s3://${S3_BUCKET}/" \
            --exclude "*" --include "*.html" --include "*.txt" \
            --cache-control "no-cache, must-revalidate"

      - name: Prune assets older than 7 days
        # Far longer than anyone keeps a tab open, short enough that orphaned
        # builds never pile up.
        run: |
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          aws s3api list-objects-v2 --bucket "${S3_BUCKET}" --prefix "_next/static/" \
            --query "Contents[?LastModified<'${CUTOFF}'].Key" --output text \
          | tr '\t' '\n' | while read -r key; do
              [ -n "$key" ] && [ "$key" != "None" ] && aws s3 rm "s3://${S3_BUCKET}/$key"
            done

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
